<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Sellify Admin Dashboard{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="h-full flex overflow-hidden font-sans antialiased">

  <!-- Sidebar -->
  <aside class="w-64 bg-slate-950/80 border-r border-slate-800 flex flex-col justify-between shrink-0">
    <div>
      <!-- Brand -->
      <div class="h-16 flex items-center px-6 border-b border-slate-800 space-x-3">
        <img src="/static/logo.png" alt="Sellify Logo" class="w-9 h-9 rounded-xl object-cover shadow-lg shadow-purple-500/20 border border-slate-700">
        <div>
          <span class="text-lg font-black tracking-wider text-white">SELLIFY</span>
          <span class="text-xs px-2 py-0.5 rounded-full bg-red-500/10 text-red-400 font-semibold border border-red-500/20 ml-1">ADMIN</span>
        </div>
      </div>

      <!-- Nav Links -->
      <nav class="p-4 space-y-1.5 text-sm font-medium">
        <a href="/admin" class="flex items-center gap-3 px-4 py-3 rounded-xl transition {% if active_page == 'dashboard' %}bg-red-600/15 text-red-400 border border-red-500/20 font-semibold{% else %}text-slate-400 hover:bg-slate-800/60 hover:text-slate-200{% endif %}">
          <i class="fa-solid fa-chart-pie w-5"></i>
          <span>Dashboard</span>
        </a>

        <a href="/admin/products" class="flex items-center gap-3 px-4 py-3 rounded-xl transition {% if active_page == 'products' %}bg-red-600/15 text-red-400 border border-red-500/20 font-semibold{% else %}text-slate-400 hover:bg-slate-800/60 hover:text-slate-200{% endif %}">
          <i class="fa-solid fa-cubes w-5"></i>
          <span>Products Catalog</span>
        </a>

        <a href="/admin/inventory" class="flex items-center gap-3 px-4 py-3 rounded-xl transition {% if active_page == 'inventory' %}bg-red-600/15 text-red-400 border border-red-500/20 font-semibold{% else %}text-slate-400 hover:bg-slate-800/60 hover:text-slate-200{% endif %}">
          <i class="fa-solid fa-boxes-stacked w-5"></i>
          <span>Inventory & Stock</span>
        </a>

        <a href="/admin/orders" class="flex items-center gap-3 px-4 py-3 rounded-xl transition {% if active_page == 'orders' %}bg-red-600/15 text-red-400 border border-red-500/20 font-semibold{% else %}text-slate-400 hover:bg-slate-800/60 hover:text-slate-200{% endif %}">
          <i class="fa-solid fa-receipt w-5"></i>
          <span>Orders</span>
        </a>
      </nav>
    </div>

    <!-- Bot Status Footer -->
    <div class="p-4 border-t border-slate-800 text-xs text-slate-500 space-y-2">
      <div class="flex items-center justify-between">
        <span>Telegram Bot:</span>
        <span class="inline-flex items-center gap-1.5 text-emerald-400 font-semibold">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Online
        </span>
      </div>
      <div class="text-[11px] text-slate-600">
        aiogram 3.x + FastAPI + SQLite/Postgres
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Top Bar -->
    <header class="h-16 border-b border-slate-800 bg-slate-900/60 backdrop-blur px-8 flex items-center justify-between shrink-0">
      <h1 class="text-xl font-bold tracking-tight text-white">{% block page_title %}Dashboard{% endblock %}</h1>
      <div class="flex items-center gap-4">
        <a href="/admin/inventory" class="px-3.5 py-2 text-xs font-semibold rounded-lg bg-red-600 hover:bg-red-500 text-white shadow-md shadow-red-600/20 transition flex items-center gap-2">
          <i class="fa-solid fa-plus"></i> Add Stock
        </a>
        <span class="text-xs text-slate-400 border border-slate-700 rounded-lg px-3 py-1.5 bg-slate-800/50">
          Super Admin
        </span>
      </div>
    </header>

    <!-- Content Body -->
    <main class="flex-1 overflow-y-auto p-8">
      {% block content %}{% endblock %}
    </main>
  </div>

</body>
</html>

services:
  - type: web
    name: sellify-web
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_NAME
        value: Sellify
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        value: digiproductsllr_bot
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
